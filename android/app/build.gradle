apply plugin: 'com.android.application'

android {
    namespace "com.jackson.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jackson.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 20
        versionName "2.2.7"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
     // 1. ADD THESE FIREBASE LIBRARIES HERE
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'
    // AppLovin MAX SDK is included via cordova-plugin-applovin-max
    // No need to add it manually here
    // Google User Messaging Platform (UMP) SDK for AdMob consent (GDPR/CCPA)
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    // Adjust Native Android SDK (install + session attribution)
    implementation 'com.adjust.sdk:adjust-android:5.6.0'
    implementation 'com.android.installreferrer:installreferrer:2.2'
    implementation 'com.google.android.gms:play-services-ads-identifier:18.1.0'
    // Google Play Integrity API
    implementation 'com.google.android.play:integrity:1.3.0'
    // AppLovin MAX Mediation Adapters (client-approved networks only)
    implementation 'com.applovin.mediation:google-adapter:23.6.0.1'
    implementation 'com.applovin.mediation:google-ad-manager-adapter:23.6.0.1'
    implementation 'com.applovin.mediation:facebook-adapter:6.21.0.0'
    implementation 'com.applovin.mediation:fyber-adapter:8.3.8.0'
    implementation 'com.applovin.mediation:inmobi-adapter:10.8.8.0'
    implementation 'com.applovin.mediation:mintegral-adapter:16.9.91.0'
    implementation 'com.applovin.mediation:bidmachine-adapter:3.4.0.0'
    implementation 'com.applovin.mediation:vungle-adapter:7.6.0.0'

    implementation 'com.applovin.mediation:moloco-adapter:4.1.0.0'
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
