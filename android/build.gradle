// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.12.3'
        classpath 'com.google.gms:google-services:4.4.2'
     


        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()

        // AppLovin MAX mediation adapters — restrict to com.applovin.* only to prevent 403s on other packages
        maven {
            url 'https://artifacts.applovin.com/android'
            content {
                includeGroupByRegex 'com\\.applovin.*'
            }
        }
        // Mintegral SDK (required by mintegral-adapter)
        maven { url 'https://dl-maven-android.mintegral.com/repository/mbridge_android_sdk_support' }
        // BidMachine SDK (required by bidmachine-adapter)
        maven { url 'https://artifactory.bidmachine.io/bidmachine' }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
